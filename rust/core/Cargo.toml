[package]
name = "vechealth-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "vechealth_core"
crate-type = ["cdylib", "rlib"] # cdylib jest wymagane przez PyO3

[dependencies]
ndarray = { version = "0.15", features = ["rayon"] }
rayon = "1.10"
faer = { version = "0.19", features = ["rayon"] }

pyo3 = { version = "0.21", features = ["extension-module"] }
numpy = "0.21"

[dev-dependencies]
rand = "0.8"