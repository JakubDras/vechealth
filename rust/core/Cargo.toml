[package]
name = "vechealth-core"
version = "0.2.0-alpha.1"
edition = "2021"

[lib]
name = "vechealth_core"
crate-type = ["cdylib", "rlib"] # the Python extension is built from `bindings`; the other crates link this one as an rlib

[dependencies]
ndarray = { version = "0.15", features = ["rayon"] }
rayon = "1.10"
faer = { version = "0.19", features = ["rayon"] }

pyo3 = { version = "0.21", features = ["extension-module"] }
numpy = "0.21"

[dev-dependencies]
rand = "0.8"