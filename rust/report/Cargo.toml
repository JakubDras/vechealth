[package]
name = "vechealth-report"
version = "0.1.0"
edition = "2021"

[lib]
name = "vechealth_report"
crate-type = ["rlib"]

[dependencies]
vechealth-core = { path = "../core" }
ndarray = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
